version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cupcake_gourmet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cupcake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cupcake_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cupcake_gourmet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cupcake} -d ${POSTGRES_DB:-cupcake_gourmet}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
